services:
  - type: web
    name: vng-key-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vng-key-db
          property: connectionString
databases:
  - name: vng-key-db
    plan: free
